name: Check plugin package
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/build-plugin-package.test.mjs
      - run: node scripts/build-plugin-package.mjs --check
      - run: node scripts/build-plugin-package.mjs
      - run: git diff --exit-code -- repository.json plugins/file-studio/atlas-plugin-file-studio.atlas-plugin.json
